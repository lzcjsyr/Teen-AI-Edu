<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>年会抽奖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,700&family=Noto+Serif+SC:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
<style>
  /* ═══════════════════════════════════════════
     BAROQUE LOTTERY — Design Tokens
     ═══════════════════════════════════════════ */
  :root {
    /* Baroque palette — warm-tinted, no pure black/white */
    --clr-burgundy-deepest: oklch(16% 0.04 18);
    --clr-burgundy-deep:    oklch(22% 0.05 15);
    --clr-burgundy:         oklch(28% 0.06 12);
    --clr-burgundy-light:   oklch(35% 0.05 10);
    --clr-gold:             oklch(78% 0.14 88);
    --clr-gold-dim:         oklch(62% 0.10 85);
    --clr-gold-pale:        oklch(82% 0.08 88);
    --clr-cream:            oklch(94% 0.02 88);
    --clr-cream-muted:      oklch(85% 0.03 85);
    --clr-velvet:           oklch(20% 0.03 350);
    --clr-ember:            oklch(55% 0.16 40);

    /* Spacing — 4pt base */
    --space-xs:  4px;
    --space-sm:  8px;
    --space-md:  16px;
    --space-lg:  24px;
    --space-xl:  32px;
    --space-2xl: 48px;
    --space-3xl: 64px;
    --space-4xl: 96px;

    /* Motion — exponential easing only */
    --ease-out-expo:  cubic-bezier(0.16, 1, 0.3, 1);
    --ease-out-quart: cubic-bezier(0.25, 1, 0.5, 1);
    --ease-in-out:    cubic-bezier(0.65, 0, 0.35, 1);
  }

  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  /* ═══════════════════════════════════════════
     BASE — Baroque velvet backdrop
     ═══════════════════════════════════════════ */
  body {
    font-family: "Noto Serif SC", "Cormorant Garamond", "Playfair Display", serif;
    background:
      /* Subtle damask-like radial pattern overlay */
      radial-gradient(ellipse 80% 60% at 50% 30%, oklch(26% 0.05 12) 0%, transparent 70%),
      radial-gradient(circle at 20% 80%, oklch(30% 0.04 10) 0%, transparent 40%),
      radial-gradient(circle at 80% 20%, oklch(25% 0.03 18) 0%, transparent 40%),
      var(--clr-burgundy-deep);
    min-height: 100vh;
    color: var(--clr-cream);
    /* Decorative top & bottom border via body pseudo */
    position: relative;
    overflow-x: hidden;
    line-height: 1.6;
  }

  /* ── Ornamental top filigree bar ── */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg,
      transparent 0%, var(--clr-gold-dim) 15%, var(--clr-gold) 25%,
      var(--clr-gold-dim) 35%, transparent 50%,
      var(--clr-gold-dim) 65%, var(--clr-gold) 75%, var(--clr-gold-dim) 85%,
      transparent 100%
    );
    z-index: 100;
  }
  body::after {
    content: "";
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 8px;
    background: linear-gradient(90deg,
      transparent 0%, var(--clr-gold-dim) 15%, var(--clr-gold) 25%,
      var(--clr-gold-dim) 35%, transparent 50%,
      var(--clr-gold-dim) 65%, var(--clr-gold) 75%, var(--clr-gold-dim) 85%,
      transparent 100%
    );
    z-index: 100;
  }

  /* ═══════════════════════════════════════════
     HEADER — Ornate proscenium arch
     ═══════════════════════════════════════════ */
  .proscenium {
    text-align: center;
    padding: var(--space-3xl) var(--space-lg) var(--space-2xl);
    position: relative;
    z-index: 1;
  }

  /* Ornamental SVG flourishes flanking the title */
  .ornament-h {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-lg);
    margin-bottom: var(--space-sm);
  }
  .ornament-h svg {
    width: clamp(80px, 12vw, 160px);
    height: auto;
    flex-shrink: 0;
    opacity: 0.85;
  }

  .title-main {
    font-family: "Playfair Display", "Noto Serif SC", serif;
    font-size: clamp(36px, 6vw, 64px);
    font-weight: 900;
    letter-spacing: 0.08em;
    color: var(--clr-gold);
    text-shadow:
      0 0 40px oklch(78% 0.14 88 / 0.35),
      0 2px 0 oklch(16% 0.04 18 / 0.6);
    position: relative;
    display: inline-block;
    line-height: 1.2;
  }
  /* Decorative line under the title */
  .title-main::after {
    content: "";
    display: block;
    width: 60%;
    height: 2px;
    margin: var(--space-sm) auto 0;
    background: linear-gradient(90deg,
      transparent, var(--clr-gold-dim), var(--clr-gold), var(--clr-gold-dim), transparent
    );
    border-radius: 1px;
  }

  .subtitle-line {
    font-family: "Cormorant Garamond", "Playfair Display", serif;
    font-size: clamp(14px, 1.8vw, 20px);
    font-style: italic;
    color: var(--clr-gold-dim);
    letter-spacing: 0.15em;
    margin-top: var(--space-sm);
    opacity: 0.9;
  }

  /* ═══════════════════════════════════════════
     MAIN LAYOUT — Symmetrical, grand
     ═══════════════════════════════════════════ */
  .stage-container {
    max-width: 1100px;
    margin: 0 auto var(--space-4xl);
    padding: 0 var(--space-lg);
    display: flex;
    gap: var(--space-2xl);
    align-items: flex-start;
  }

  /* ═══════════════════════════════════════════
     MAIN PANEL — The lottery stage
     ═══════════════════════════════════════════ */
  .main-panel {
    flex: 1;
    min-width: 0;
    text-align: center;
    /* Ornate gilded frame via layered borders */
    background:
      linear-gradient(180deg, oklch(18% 0.04 15 / 0.95), oklch(24% 0.05 10 / 0.95));
    border: 3px solid var(--clr-gold-dim);
    border-radius: 4px;
    box-shadow:
      inset 0 0 60px oklch(20% 0.03 15 / 0.5),
      0 0 0 6px var(--clr-burgundy-deepest),
      0 0 0 9px oklch(78% 0.14 88 / 0.2),
      0 0 40px oklch(16% 0.04 18 / 0.7);
    padding: var(--space-2xl) var(--space-xl);
    position: relative;
  }
  /* Corner ornaments */
  .main-panel::before,
  .main-panel::after {
    position: absolute;
    content: "";
    width: 36px;
    height: 36px;
    pointer-events: none;
    opacity: 0.45;
  }
  .main-panel::before {
    top: -3px; left: -3px;
    border-top: 3px solid var(--clr-gold);
    border-left: 3px solid var(--clr-gold);
  }
  .main-panel::after {
    bottom: -3px; right: -3px;
    border-bottom: 3px solid var(--clr-gold);
    border-right: 3px solid var(--clr-gold);
  }

  /* ── Name Display Stage ── */
  .name-stage-wrapper {
    position: relative;
    margin-bottom: var(--space-sm);
  }

  /* Decorative filigree frame around name display */
  .name-stage-frame {
    position: relative;
    padding: 6px;
    background: var(--clr-gold-dim);
    border-radius: 4px;
    box-shadow: 0 0 30px oklch(78% 0.14 88 / 0.25);
  }
  .name-stage {
    width: 100%;
    height: clamp(180px, 22vw, 220px);
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--clr-burgundy-deepest);
    border: 1px solid oklch(78% 0.14 88 / 0.3);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
    box-shadow: inset 0 0 60px oklch(16% 0.03 15 / 0.8);
  }
  /* Inner vignette */
  .name-stage::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 70% 70% at 50% 50%, transparent 40%, oklch(12% 0.03 15 / 0.6));
    pointer-events: none;
  }

  .name-display {
    font-family: "Noto Serif SC", "Playfair Display", serif;
    font-size: clamp(52px, 8vw, 90px);
    font-weight: 900;
    color: var(--clr-gold);
    text-shadow:
      0 0 40px oklch(78% 0.14 88 / 0.5),
      0 2px 6px oklch(16% 0.04 18 / 0.6);
    user-select: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90%;
    position: relative;
    z-index: 1;
    transition: none;
  }
  .name-display.stopped {
    animation: baroque-reveal 0.7s var(--ease-out-expo) forwards;
  }
  @keyframes baroque-reveal {
    0%   { transform: scale(0.85); opacity: 0.4; filter: blur(4px); }
    60%  { transform: scale(1.04); opacity: 1; filter: blur(0); }
    100% { transform: scale(1); filter: blur(0); }
  }

  /* ── Department Display ── */
  .dept-display {
    font-family: "Cormorant Garamond", "Noto Serif SC", serif;
    font-size: clamp(18px, 2.5vw, 26px);
    font-style: italic;
    color: var(--clr-cream-muted);
    min-height: 36px;
    margin: var(--space-md) 0 var(--space-lg);
    letter-spacing: 0.08em;
    opacity: 0;
    transition: opacity 0.5s var(--ease-out-quart);
    position: relative;
  }
  .dept-display.visible {
    opacity: 1;
  }
  /* Ornamental diamonds flanking department text */
  .dept-display.visible::before,
  .dept-display.visible::after {
    content: "\2726";
    font-size: 12px;
    color: var(--clr-gold-dim);
    margin: 0 10px;
    vertical-align: middle;
    opacity: 0.6;
  }

  /* ── Stats — Ornate counters ── */
  .stats {
    display: flex;
    justify-content: center;
    gap: var(--space-2xl);
    margin-bottom: var(--space-xl);
    font-family: "Cormorant Garamond", "Noto Serif SC", serif;
    font-size: clamp(14px, 1.4vw, 16px);
    color: var(--clr-cream-muted);
    letter-spacing: 0.06em;
  }
  .stat-item {
    display: flex;
    align-items: baseline;
    gap: var(--space-xs);
    padding: var(--space-xs) var(--space-md);
    border: 1px solid oklch(78% 0.14 88 / 0.15);
    border-radius: 2px;
    background: oklch(20% 0.03 15 / 0.4);
  }
  .stat-value {
    font-family: "Playfair Display", "Noto Serif SC", serif;
    font-size: clamp(22px, 2.8vw, 32px);
    font-weight: 900;
    color: var(--clr-gold);
    line-height: 1;
  }

  /* ── Buttons — Baroque-inspired ── */
  .btn-group {
    display: flex;
    justify-content: center;
    gap: clamp(8px, 1.5vw, 14px);
    flex-wrap: wrap;
  }

  button {
    font-family: "Noto Serif SC", "Playfair Display", serif;
    padding: 14px clamp(20px, 3vw, 36px);
    border: 2px solid;
    border-radius: 2px;
    font-size: clamp(15px, 1.5vw, 18px);
    font-weight: 700;
    letter-spacing: 0.08em;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    /* Animate only transform + box-shadow + background */
    transition:
      transform 0.15s var(--ease-out-expo),
      box-shadow 0.3s var(--ease-out-quart),
      background 0.3s var(--ease-out-quart);
    text-transform: uppercase;
  }
  button:active {
    transform: translateY(2px);
  }
  button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
    transform: none !important;
  }
  /* Golden shimmer on hover for primary buttons */
  button:not(:disabled)::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg,
      transparent, oklch(100% 0 0 / 0.06), transparent
    );
    transition: left 0.5s var(--ease-out-quart);
  }
  button:not(:disabled):hover::after {
    left: 100%;
  }

  .btn-start {
    background: linear-gradient(180deg, oklch(42% 0.08 15), oklch(30% 0.06 12));
    color: var(--clr-gold-pale);
    border-color: var(--clr-gold-dim);
    box-shadow: 0 4px 20px oklch(78% 0.14 88 / 0.2);
  }
  .btn-start:not(:disabled):hover {
    box-shadow: 0 6px 30px oklch(78% 0.14 88 / 0.4);
    background: linear-gradient(180deg, oklch(45% 0.09 15), oklch(33% 0.07 12));
  }

  .btn-stop {
    background: linear-gradient(180deg, var(--clr-ember), oklch(42% 0.12 35));
    color: var(--clr-cream);
    border-color: oklch(65% 0.15 40);
    box-shadow: 0 4px 20px oklch(55% 0.16 40 / 0.25);
  }
  .btn-stop:not(:disabled):hover {
    box-shadow: 0 6px 30px oklch(55% 0.16 40 / 0.45);
  }

  .btn-reset {
    background: linear-gradient(180deg, oklch(32% 0.02 60), oklch(22% 0.02 80));
    color: var(--clr-cream-muted);
    border-color: oklch(45% 0.02 70);
    box-shadow: 0 4px 16px oklch(16% 0.02 15 / 0.5);
  }
  .btn-reset:not(:disabled):hover {
    color: var(--clr-cream);
    border-color: oklch(60% 0.02 70);
  }

  .btn-export {
    background: linear-gradient(180deg, oklch(35% 0.04 250), oklch(24% 0.03 250));
    color: var(--clr-cream);
    border-color: oklch(50% 0.08 245);
    box-shadow: 0 4px 20px oklch(40% 0.06 250 / 0.2);
  }
  .btn-export:not(:disabled):hover {
    box-shadow: 0 6px 30px oklch(40% 0.06 250 / 0.4);
  }

  /* ═══════════════════════════════════════════
     SIDE PANEL — Scroll of Winners
     ═══════════════════════════════════════════ */
  .side-panel {
    width: 300px;
    flex-shrink: 0;
    background:
      linear-gradient(180deg, oklch(18% 0.04 15 / 0.95), oklch(24% 0.05 10 / 0.95));
    border: 2px solid var(--clr-gold-dim);
    border-radius: 4px;
    box-shadow:
      inset 0 0 40px oklch(20% 0.03 15 / 0.5),
      0 0 0 4px var(--clr-burgundy-deepest),
      0 0 0 6px oklch(78% 0.14 88 / 0.12);
    padding: var(--space-lg) var(--space-md);
    display: flex;
    flex-direction: column;
    max-height: clamp(480px, 65vh, 620px);
    position: relative;
  }
  /* Scroll-like header ribbon */
  .side-panel::before {
    content: "";
    position: absolute;
    top: -1px; left: 20px; right: 20px;
    height: 2px;
    background: linear-gradient(90deg,
      transparent, var(--clr-gold-dim), var(--clr-gold), var(--clr-gold-dim), transparent
    );
  }

  .side-panel h3 {
    font-family: "Playfair Display", "Noto Serif SC", serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--clr-gold);
    text-align: center;
    letter-spacing: 0.1em;
    padding-bottom: var(--space-md);
    margin-bottom: var(--space-md);
    border-bottom: 1px solid oklch(78% 0.14 88 / 0.2);
    position: relative;
  }
  /* Ornamental diamonds */
  .side-panel h3::after {
    content: "\2726";
    display: block;
    position: absolute;
    bottom: -8px; left: 50%;
    transform: translateX(-50%);
    color: var(--clr-gold-dim);
    font-size: 10px;
    line-height: 1;
  }

  .winner-list {
    flex: 1;
    overflow-y: auto;
    list-style: none;
    /* Styled scrollbar */
    scrollbar-width: thin;
    scrollbar-color: var(--clr-gold-dim) var(--clr-burgundy-deepest);
  }
  .winner-list::-webkit-scrollbar { width: 4px; }
  .winner-list::-webkit-scrollbar-track { background: var(--clr-burgundy-deepest); }
  .winner-list::-webkit-scrollbar-thumb {
    background: var(--clr-gold-dim);
    border-radius: 2px;
  }

  .winner-item {
    padding: 10px 14px;
    margin-bottom: var(--space-sm);
    background: oklch(22% 0.03 15 / 0.6);
    border: 1px solid oklch(78% 0.14 88 / 0.12);
    border-radius: 2px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    opacity: 0;
    transform: translateX(16px);
    animation: winner-enter 0.45s var(--ease-out-quart) forwards;
    position: relative;
  }
  /* Small ornamental dot on winner items */
  .winner-item::before {
    content: "";
    width: 5px; height: 5px;
    background: var(--clr-gold-dim);
    border-radius: 50%;
    position: absolute;
    left: 4px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0.5;
  }

  @keyframes winner-enter {
    to { opacity: 1; transform: translateX(0); }
  }

  .winner-item .wname {
    font-family: "Noto Serif SC", serif;
    font-size: 15px;
    font-weight: 700;
    color: var(--clr-gold);
  }
  .winner-item .wdept {
    font-family: "Cormorant Garamond", "Noto Serif SC", serif;
    font-size: 12px;
    font-style: italic;
    color: var(--clr-cream-muted);
  }
  .winner-index {
    font-family: "Cormorant Garamond", serif;
    font-size: 11px;
    color: var(--clr-gold-dim);
    margin-right: var(--space-xs);
    opacity: 0.6;
  }

  .no-winner {
    text-align: center;
    color: oklch(55% 0.03 85);
    padding: var(--space-2xl) 0;
    font-family: "Cormorant Garamond", "Noto Serif SC", serif;
    font-size: 14px;
    font-style: italic;
    letter-spacing: 0.06em;
    opacity: 0.55;
  }

  /* ═══════════════════════════════════════════
     CONFETTI CANVAS
     ═══════════════════════════════════════════ */
  #confetti-canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 200;
  }

  /* ═══════════════════════════════════════════
     RESPONSIVE — @media for layout breakpoints
     ═══════════════════════════════════════════ */
  @media (max-width: 820px) {
    .stage-container {
      flex-direction: column;
      align-items: stretch;
    }
    .side-panel {
      width: 100%;
      max-height: 280px;
    }
    .ornament-h svg { width: 60px; }
    .main-panel { padding: var(--space-lg) var(--space-md); }
  }

  /* Reduced motion respect */
  @media (prefers-reduced-motion: reduce) {
    .name-display.stopped { animation: none; }
    .winner-item { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>

<!-- ═══════ HEADER — Proscenium Arch ═══════ -->
<header class="proscenium">
  <div class="ornament-h">
    <!-- Baroque scrollwork flourishes — left -->
    <svg viewBox="0 0 160 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M0 30 Q20 5,40 20 Q60 35,80 30 Q100 25,120 35 Q140 45,160 30"
        stroke="oklch(78% 0.14 88)" stroke-width="1.8" fill="none" opacity="0.6"/>
      <path d="M20 30 Q35 18,50 28 Q65 38,80 30 Q95 22,110 32 Q125 42,140 30"
        stroke="oklch(78% 0.14 88)" stroke-width="1" fill="none" opacity="0.3"/>
      <circle cx="80" cy="30" r="3" fill="oklch(78% 0.14 88)" opacity="0.6"/>
      <circle cx="40" cy="28" r="2" fill="oklch(78% 0.14 88)" opacity="0.35"/>
      <circle cx="120" cy="32" r="2" fill="oklch(78% 0.14 88)" opacity="0.35"/>
    </svg>

    <div>
      <h1 class="title-main">&#x2726; 年 会 抽 奖 &#x2726;</h1>
      <p class="subtitle-line">— Grand Lottery &bull; Anno Domini MMXXVI —</p>
    </div>

    <!-- Baroque scrollwork flourishes — right (mirrored) -->
    <svg viewBox="0 0 160 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M160 30 Q140 5,120 20 Q100 35,80 30 Q60 25,40 35 Q20 45,0 30"
        stroke="oklch(78% 0.14 88)" stroke-width="1.8" fill="none" opacity="0.6"/>
      <path d="M140 30 Q125 18,110 28 Q95 38,80 30 Q65 22,50 32 Q35 42,20 30"
        stroke="oklch(78% 0.14 88)" stroke-width="1" fill="none" opacity="0.3"/>
      <circle cx="80" cy="30" r="3" fill="oklch(78% 0.14 88)" opacity="0.6"/>
      <circle cx="40" cy="32" r="2" fill="oklch(78% 0.14 88)" opacity="0.35"/>
      <circle cx="120" cy="28" r="2" fill="oklch(78% 0.14 88)" opacity="0.35"/>
    </svg>
  </div>
</header>

<!-- ═══════ MAIN STAGE ═══════ -->
<div class="stage-container">

  <!-- ── Left: Lottery Panel ── -->
  <section class="main-panel">
    <div class="name-stage-wrapper">
      <div class="name-stage-frame">
        <div class="name-stage">
          <div class="name-display" id="nameDisplay">准备就绪</div>
        </div>
      </div>
    </div>

    <div class="dept-display" id="deptDisplay">&nbsp;</div>

    <div class="stats">
      <div class="stat-item">
        待抽 <span class="stat-value" id="remaining">29</span>
      </div>
      <div class="stat-item">
        已中 <span class="stat-value" id="wonCount">0</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn-start" id="btnStart" onclick="startLottery()">&#x2726; 开始抽奖</button>
      <button class="btn-stop" id="btnStop" onclick="stopLottery()" disabled>&#x25C9; 停&nbsp;&nbsp;止</button>
      <button class="btn-reset" id="btnReset" onclick="resetLottery()">&#x21BA; 重&nbsp;&nbsp;置</button>
      <button class="btn-export" id="btnExport" onclick="exportWinners()">&#x2913; 导出名单</button>
    </div>
  </section>

  <!-- ── Right: Winners Scroll ── -->
  <aside class="side-panel">
    <h3>&#x2726; 中 奖 名 录 &#x2726;</h3>
    <ul class="winner-list" id="winnerList">
      <li class="no-winner">静候佳音&hellip;</li>
    </ul>
  </aside>
</div>

<!-- ═══════ CONFETTI CANVAS ═══════ -->
<canvas id="confetti-canvas"></canvas>

<!-- ═══════ SCRIPTS ═══════ -->
<script>
// ============================================================
//   DATA — 硬编码抽奖人员池（"是否参与"=是，共29人）
// ============================================================
var ALL_PARTICIPANTS = [
  { name:"张晨",   dept:"运营部" },
  { name:"李婉婷", dept:"市场部" },
  { name:"王浩然", dept:"技术部" },
  { name:"刘思远", dept:"产品部" },
  { name:"陈雨欣", dept:"财务部" },
  { name:"杨子墨", dept:"人事行政部" },
  { name:"赵明轩", dept:"招商部" },
  { name:"黄若琳", dept:"客户成功部" },
  { name:"周宇航", dept:"设计部" },
  { name:"吴嘉怡", dept:"运营部" },
  { name:"徐梓涵", dept:"市场部" },
  { name:"孙一鸣", dept:"技术部" },
  { name:"胡安琪", dept:"产品部" },
  { name:"朱俊杰", dept:"财务部" },
  { name:"高语桐", dept:"人事行政部" },
  { name:"林泽宇", dept:"招商部" },
  { name:"何佳宁", dept:"客户成功部" },
  { name:"郭子涵", dept:"设计部" },
  { name:"马天佑", dept:"运营部" },
  { name:"罗欣怡", dept:"市场部" },
  { name:"梁博文", dept:"技术部" },
  { name:"宋雨桐", dept:"产品部" },
  { name:"郑凯文", dept:"财务部" },
  { name:"谢若曦", dept:"人事行政部" },
  { name:"唐景行", dept:"招商部" },
  { name:"韩依诺", dept:"客户成功部" },
  { name:"冯奕辰", dept:"设计部" },
  { name:"董诗涵", dept:"运营部" },
  { name:"程沐阳", dept:"技术部" }
];

// ============================================================
//   STATE
// ============================================================
var pool = [];
var winners = [];
var timer = null;
var isRunning = false;

var nameDisplay  = document.getElementById("nameDisplay");
var deptDisplay  = document.getElementById("deptDisplay");
var remainingEl  = document.getElementById("remaining");
var wonCountEl   = document.getElementById("wonCount");
var winnerList   = document.getElementById("winnerList");
var btnStart     = document.getElementById("btnStart");
var btnStop      = document.getElementById("btnStop");
var btnReset     = document.getElementById("btnReset");
var btnExport    = document.getElementById("btnExport");

// ============================================================
//   INIT
// ============================================================
function init() {
  pool = ALL_PARTICIPANTS.map(function(_, i) { return i; });
  winners = [];
  updateUI();
  nameDisplay.textContent = "准备就绪";
  nameDisplay.classList.remove("stopped");
  deptDisplay.classList.remove("visible");
  deptDisplay.innerHTML = "&nbsp;";
}
init();

// ============================================================
//   CONFETTI (Baroque edition — restrained gold/burgundy)
// ============================================================
var confettiCanvas = document.getElementById("confetti-canvas");
var ctx = confettiCanvas.getContext("2d");
var confettiParticles = [];
var confettiAnimId = null;

function resizeConfetti() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
resizeConfetti();
window.addEventListener("resize", resizeConfetti);

function fireConfetti() {
  var colors = [
    "oklch(78% 0.14 88)",   // gold
    "oklch(82% 0.08 88)",   // pale gold
    "oklch(42% 0.08 15)",   // burgundy
    "oklch(55% 0.16 40)",   // ember
    "oklch(94% 0.02 88)",   // cream
    "oklch(35% 0.05 10)"    // deep wine
  ];

  for (var i = 0; i < 120; i++) {
    confettiParticles.push({
      x: Math.random() * confettiCanvas.width,
      y: -20 - Math.random() * 100,
      w: 4 + Math.random() * 8,
      h: 3 + Math.random() * 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 6,
      vy: 2 + Math.random() * 5,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      opacity: 1,
      life: 1
    });
  }

  if (!confettiAnimId) {
    animateConfetti();
  }
}

function animateConfetti() {
  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

  var alive = false;
  for (var i = confettiParticles.length - 1; i >= 0; i--) {
    var p = confettiParticles[i];
    p.x += p.vx;
    p.vy += 0.06; // gravity
    p.y += p.vy;
    p.rotation += p.rotSpeed;
    p.life -= 0.006;

    if (p.life <= 0 || p.y > confettiCanvas.height + 20) {
      confettiParticles.splice(i, 1);
      continue;
    }
    alive = true;

    ctx.save();
    ctx.globalAlpha = p.life;
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  }

  if (alive) {
    confettiAnimId = requestAnimationFrame(animateConfetti);
  } else {
    confettiAnimId = null;
  }
}

// ============================================================
//   UI UPDATE
// ============================================================
function updateUI() {
  remainingEl.textContent = pool.length;
  wonCountEl.textContent = winners.length;

  if (pool.length === 0) {
    btnStart.disabled = true;
    btnStop.disabled = true;
  } else if (isRunning) {
    btnStart.disabled = true;
    btnStop.disabled = false;
  } else {
    btnStart.disabled = false;
    btnStop.disabled = true;
  }

  if (winners.length === 0) {
    winnerList.innerHTML = '<li class="no-winner">静候佳音&hellip;</li>';
    btnExport.disabled = true;
  } else {
    btnExport.disabled = false;
    var html = "";
    for (var i = 0; i < winners.length; i++) {
      var w = winners[i];
      html += '<li class="winner-item" style="animation-delay:' + (i * 0.05) + 's">'
        + '<span><span class="winner-index">' + romanNumeral(i+1) + '.</span><span class="wname">' + escHtml(w.name) + '</span></span>'
        + '<span class="wdept">' + escHtml(w.dept) + '</span>'
        + '</li>';
    }
    winnerList.innerHTML = html;
  }
}

function escHtml(s) {
  var d = document.createElement("div");
  d.appendChild(document.createTextNode(s));
  return d.innerHTML;
}

function romanNumeral(n) {
  var vals = [
    [30,"XXX"],[20,"XX"],[10,"X"],[9,"IX"],[8,"VIII"],[7,"VII"],
    [6,"VI"],[5,"V"],[4,"IV"],[3,"III"],[2,"II"],[1,"I"]
  ];
  var r = "";
  for (var i = 0; i < vals.length; i++) {
    while (n >= vals[i][0]) { r += vals[i][1]; n -= vals[i][0]; }
  }
  return r;
}

// ============================================================
//   START LOTTERY
// ============================================================
function startLottery() {
  if (pool.length === 0) {
    alert("诸君皆已中选，请\"重置\"以重新开局。");
    return;
  }
  if (isRunning) return;

  isRunning = true;
  nameDisplay.classList.remove("stopped");
  deptDisplay.classList.remove("visible");
  updateUI();

  timer = setInterval(function() {
    var idx = Math.floor(Math.random() * pool.length);
    var p = ALL_PARTICIPANTS[pool[idx]];
    nameDisplay.textContent = p.name;
  }, 50);
}

// ============================================================
//   STOP & REVEAL WINNER
// ============================================================
function stopLottery() {
  if (!isRunning) return;

  clearInterval(timer);
  timer = null;
  isRunning = false;

  var currentName = nameDisplay.textContent;
  var winnerIdx = -1, poolIdx = -1;

  for (var i = 0; i < pool.length; i++) {
    if (ALL_PARTICIPANTS[pool[i]].name === currentName) {
      winnerIdx = pool[i];
      poolIdx = i;
      break;
    }
  }
  if (winnerIdx === -1) {
    poolIdx = Math.floor(Math.random() * pool.length);
    winnerIdx = pool[poolIdx];
  }

  var winner = ALL_PARTICIPANTS[winnerIdx];
  pool.splice(poolIdx, 1);

  winners.push({
    name: winner.name,
    dept: winner.dept,
    time: new Date().toLocaleString("zh-CN", { hour12: false })
  });

  // Reveal
  nameDisplay.textContent = winner.name;
  nameDisplay.classList.add("stopped");
  deptDisplay.textContent = winner.dept;
  deptDisplay.classList.add("visible");

  // Baroque confetti!
  fireConfetti();

  updateUI();

  if (pool.length === 0) {
    setTimeout(function() {
      alert("恭贺！满座皆已入榜，盛会圆满！");
    }, 800);
  }
}

// ============================================================
//   RESET
// ============================================================
function resetLottery() {
  if (isRunning) {
    clearInterval(timer);
    timer = null;
    isRunning = false;
  }
  if (winners.length > 0) {
    if (!confirm("重置将涤清一切中奖名录。\n\n若未导出，请先\"导出名单\"。\n\n确认重置？")) {
      return;
    }
  }
  pool = ALL_PARTICIPANTS.map(function(_, i) { return i; });
  winners = [];
  nameDisplay.textContent = "准备就绪";
  nameDisplay.classList.remove("stopped");
  deptDisplay.classList.remove("visible");
  deptDisplay.innerHTML = "&nbsp;";
  updateUI();
}

// ============================================================
//   EXPORT EXCEL
// ============================================================
function exportWinners() {
  if (winners.length === 0) {
    alert("尚无中奖名录可导出。");
    return;
  }

  var data = [["序号", "姓名", "部门", "中奖时间"]];
  for (var i = 0; i < winners.length; i++) {
    data.push([i+1, winners[i].name, winners[i].dept, winners[i].time]);
  }

  var ws = XLSX.utils.aoa_to_sheet(data);
  ws["!cols"] = [{ wch: 6 }, { wch: 12 }, { wch: 16 }, { wch: 22 }];

  var wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "中奖名录");
  XLSX.writeFile(wb, "年会中奖名单.xlsx");

  setTimeout(function() {
    alert("名录已缮写完毕：\"年会中奖名单.xlsx\"\n\n善为保存——此间荣光仅存于眼前，一刷新便烟消云散。");
  }, 300);
}

// ============================================================
//   BEFORE UNLOAD — protect un-exported winners
// ============================================================
window.addEventListener("beforeunload", function(e) {
  if (winners.length > 0) {
    var msg = "中奖名录尚未导出！请先\"导出名单\"再行离去。";
    e.preventDefault();
    e.returnValue = msg;
    return msg;
  }
});
</script>

</body>
</html>
