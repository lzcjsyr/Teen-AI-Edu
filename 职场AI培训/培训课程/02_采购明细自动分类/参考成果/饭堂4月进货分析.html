<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>饭堂4月进货明细 - 科目分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --accent: #3b82f6;
    --radius: 16px;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow: 0 4px 24px rgba(0,0,0,0.06);
    --cat-meat: #ef4444;
    --cat-veg: #22c55e;
    --cat-staple: #eab308;
    --cat-oil: #f97316;
    --cat-supply: #8b5cf6;
    --cat-drink: #06b6d4;
    --cat-pkg: #94a3b8;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100dvh;
    line-height: 1.6;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  /* Header */
  .header {
    text-align: center;
    margin-bottom: 48px;
  }
  .header .badge {
    display: inline-block;
    background: #eff6ff;
    color: #2563eb;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 6px 14px;
    border-radius: 100px;
    margin-bottom: 16px;
  }
  .header h1 {
    font-size: 2rem;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }
  .header .subtitle {
    font-size: 0.95rem;
    color: var(--text-secondary);
    font-weight: 400;
  }
  .header .total-card {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 28px;
    margin-top: 24px;
    box-shadow: var(--shadow-sm);
  }
  .header .total-label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-weight: 500;
  }
  .header .total-value {
    font-family: 'Outfit', sans-serif;
    font-size: 2rem;
    font-weight: 700;
    color: #0f172a;
    letter-spacing: -0.02em;
  }

  /* Grid layout */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
    margin-bottom: 32px;
  }

  @media (max-width: 860px) {
    .grid { grid-template-columns: 1fr; }
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    box-shadow: var(--shadow-sm);
    transition: box-shadow 0.2s ease;
  }
  .card:hover {
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 20px;
  }
  .chart-wrap {
    position: relative;
    width: 100%;
    max-width: 420px;
    margin: 0 auto;
    aspect-ratio: 1;
  }

  /* Stats cards */
  .stats-grid {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .stat-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 12px;
    background: #f8fafc;
    transition: background 0.15s ease, transform 0.15s ease;
    cursor: default;
  }
  .stat-item:hover {
    background: #f1f5f9;
    transform: translateX(4px);
  }
  .stat-dot {
    width: 12px;
    height: 12px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  .stat-info {
    flex: 1;
    min-width: 0;
  }
  .stat-name {
    font-size: 0.9rem;
    font-weight: 600;
    color: #334155;
  }
  .stat-code {
    font-family: 'Outfit', sans-serif;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .stat-amount {
    font-family: 'Outfit', sans-serif;
    font-size: 1rem;
    font-weight: 600;
    color: #0f172a;
    text-align: right;
    white-space: nowrap;
  }
  .stat-pct {
    font-family: 'Outfit', sans-serif;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-secondary);
    text-align: right;
    min-width: 44px;
  }

  /* Full width table */
  .table-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .table-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 28px 16px;
    border-bottom: 1px solid var(--border);
  }
  .table-header .card-title { margin-bottom: 0; }
  table {
    width: 100%;
    border-collapse: collapse;
  }
  thead th {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    padding: 14px 20px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    background: #fafbfc;
  }
  thead th:last-child,
  thead th:nth-last-child(2) { text-align: right; }
  tbody td {
    padding: 14px 20px;
    font-size: 0.9rem;
    border-bottom: 1px solid #f1f5f9;
  }
  tbody td:last-child,
  tbody td:nth-last-child(2) {
    font-family: 'Outfit', sans-serif;
    text-align: right;
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #f8fafc; }
  .dot-sm {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    margin-right: 10px;
    vertical-align: middle;
    position: relative;
    top: -1px;
  }
  .rank-num {
    display: inline-block;
    width: 22px;
    height: 22px;
    line-height: 22px;
    text-align: center;
    border-radius: 6px;
    font-family: 'Outfit', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--text-secondary);
    background: #f1f5f9;
    margin-right: 10px;
  }
  .rank-num.top { background: #fef2f2; color: #dc2626; }
  .progress-bar {
    display: inline-block;
    height: 6px;
    border-radius: 3px;
    margin-left: 10px;
    vertical-align: middle;
    opacity: 0.6;
  }

  /* Footer */
  .footer {
    text-align: center;
    margin-top: 40px;
    color: var(--text-muted);
    font-size: 0.82rem;
  }

  /* Animations */
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-in {
    animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  .delay-1 { animation-delay: 0.1s; }
  .delay-2 { animation-delay: 0.2s; }
  .delay-3 { animation-delay: 0.35s; }
  .delay-4 { animation-delay: 0.5s; }

  @media (prefers-reduced-motion: reduce) {
    .animate-in { animation: none; opacity: 1; transform: none; }
    .stat-item:hover { transform: none; }
  }
</style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <header class="header animate-in">
    <div class="badge">SUBJECT ANALYSIS</div>
    <h1>饭堂 4 月进货明细分析</h1>
    <p class="subtitle">珠海市酩悦商贸有限公司 · 2026年4月 · 共 7 个科目 1,171 笔交易</p>
    <div class="total-card">
      <span class="total-label">采购总额</span>
      <span class="total-value">&yen;44,218.51</span>
    </div>
  </header>

  <!-- Pie Chart + Top Stats -->
  <div class="grid">
    <div class="card animate-in delay-1">
      <div class="card-title">金额占比分布</div>
      <div class="chart-wrap">
        <canvas id="pieChart"></canvas>
      </div>
    </div>
    <div class="card animate-in delay-2">
      <div class="card-title">科目概览</div>
      <div class="stats-grid" id="statsList"></div>
    </div>
  </div>

  <!-- Detail Table -->
  <div class="table-card animate-in delay-3">
    <div class="table-header">
      <span class="card-title">科目明细汇总</span>
      <span style="font-family:'Outfit',sans-serif;font-size:0.82rem;color:var(--text-muted);">单位：元</span>
    </div>
    <table>
      <thead>
        <tr>
          <th style="width:60px;">排名</th>
          <th>科目名称</th>
          <th>科目代码</th>
          <th>金额</th>
          <th>占比</th>
        </tr>
      </thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>

  <footer class="footer animate-in delay-4">
    数据来源：饭堂4月进货明细.xls · 自动分类汇总生成
  </footer>
</div>

<script>
const categories = [
  { code: '1403.01.01', name: '荤食类',     amount: 23623.06, color: '#ef4444', colorBg: '#fef2f2' },
  { code: '1403.01.02', name: '蔬菜辅菜类', amount: 10538.55, color: '#22c55e', colorBg: '#f0fdf4' },
  { code: '1403.01.03', name: '主食类',     amount:  4952.50, color: '#eab308', colorBg: '#fefce8' },
  { code: '1403.01.04', name: '粮油调味',   amount:  4231.40, color: '#f97316', colorBg: '#fff7ed' },
  { code: '1403.01.07', name: '低值易耗',   amount:   463.00, color: '#8b5cf6', colorBg: '#faf5ff' },
  { code: '1403.01.05', name: '饮品原料',   amount:   407.00, color: '#06b6d4', colorBg: '#ecfeff' },
  { code: '1403.01.06', name: '包装类',     amount:     3.00, color: '#94a3b8', colorBg: '#f8fafc' },
];

const total = categories.reduce((s, c) => s + c.amount, 0);
const fmt = (v) => '¥' + v.toLocaleString('zh-CN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = (v) => (v / total * 100).toFixed(1) + '%';

// Doughnut chart
const ctx = document.getElementById('pieChart').getContext('2d');
new Chart(ctx, {
  type: 'doughnut',
  data: {
    labels: categories.map(c => c.name),
    datasets: [{
      data: categories.map(c => c.amount),
      backgroundColor: categories.map(c => c.color),
      borderColor: '#ffffff',
      borderWidth: 3,
      hoverBorderWidth: 4,
      hoverBorderColor: '#ffffff',
    }]
  },
  options: {
    responsive: true,
    maintainAspectRatio: true,
    cutout: '62%',
    animation: {
      animateScale: true,
      animateRotate: true,
      duration: 1200,
      easing: 'easeOutQuart',
    },
    plugins: {
      legend: { display: false },
      tooltip: {
        backgroundColor: '#0f172a',
        titleFont: { family: "'Noto Sans SC'", size: 13, weight: '600' },
        bodyFont: { family: "'Outfit'", size: 14, weight: '500' },
        padding: 14,
        cornerRadius: 10,
        displayColors: true,
        boxPadding: 4,
        callbacks: {
          label: function(ctx) {
            return ' ' + fmt(ctx.raw) + '  (' + pct(ctx.raw) + ')';
          }
        }
      }
    }
  },
  plugins: [{
    id: 'centerText',
    afterDraw(chart) {
      const { ctx, width, height } = chart;
      ctx.save();
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const cx = width / 2;
      const cy = height / 2;

      ctx.font = "700 26px 'Outfit'";
      ctx.fillStyle = '#0f172a';
      ctx.fillText(pct(categories[0].amount), cx, cy - 6);

      ctx.font = "500 12px 'Noto Sans SC'";
      ctx.fillStyle = '#64748b';
      ctx.fillText('最大科目占比', cx, cy + 18);
      ctx.restore();
    }
  }]
});

// Stats list
const statsList = document.getElementById('statsList');
categories.forEach((c, i) => {
  const div = document.createElement('div');
  div.className = 'stat-item';
  div.style.animationDelay = (0.15 * i) + 's';
  div.innerHTML = `
    <span class="stat-dot" style="background:${c.color};"></span>
    <div class="stat-info">
      <div class="stat-name">${c.name}</div>
      <div class="stat-code">${c.code}</div>
    </div>
    <div>
      <div class="stat-amount">${fmt(c.amount)}</div>
      <div class="stat-pct">${pct(c.amount)}</div>
    </div>
  `;
  statsList.appendChild(div);
});

// Detail table
const tbody = document.getElementById('tableBody');
categories.forEach((c, i) => {
  const tr = document.createElement('tr');
  const rankCls = i < 3 ? ' top' : '';
  tr.innerHTML = `
    <td><span class="rank-num${rankCls}">${i + 1}</span></td>
    <td><span class="dot-sm" style="background:${c.color};"></span>${c.name}</td>
    <td style="font-family:'Outfit',sans-serif;font-size:0.82rem;color:var(--text-muted);">${c.code}</td>
    <td style="font-weight:600;">${fmt(c.amount)}</td>
    <td>
      <span style="font-weight:600;">${pct(c.amount)}</span>
      <span class="progress-bar" style="width:${Math.max(8, c.amount/total*160)}px;background:${c.color};"></span>
    </td>
  `;
  tbody.appendChild(tr);
});
</script>
</body>
</html>
